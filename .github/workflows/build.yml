name: Build

# Every push / PR: build + test.
# Push a tag like v1.0.1: also publishes a GitHub Release with the plugin zip.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Work out version
        id: ver
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            v="${GITHUB_REF_NAME#v}"
          else
            v="0.0.0"
          fi
          # Jellyfin wants a four-part version (1.2.3 -> 1.2.3.0).
          parts=$(echo "$v" | tr '.' '\n' | wc -l)
          while [ "$parts" -lt 4 ]; do v="$v.0"; parts=$((parts+1)); done
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: Test
        run: dotnet test -c Release

      - name: Build plugin
        run: >
          dotnet build src/Jellyfin.Plugin.WatchOrder -c Release
          -p:AssemblyVersion=${{ steps.ver.outputs.version }}
          -p:FileVersion=${{ steps.ver.outputs.version }}

      - name: Package
        run: |
          mkdir -p dist
          zip -j "dist/watch-order-playlists_${{ steps.ver.outputs.version }}.zip" \
            src/Jellyfin.Plugin.WatchOrder/bin/Release/net10.0/Jellyfin.Plugin.WatchOrder.dll

      - uses: actions/upload-artifact@v4
        with:
          name: watch-order-playlists_${{ steps.ver.outputs.version }}
          path: dist/*.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME" dist/*.zip
          --repo "$GITHUB_REPOSITORY"
          --title "$GITHUB_REF_NAME"
          --generate-notes
