name: Build

# Every push / PR: build + test.
# Push a tag like v1.0.1: also publishes a GitHub Release with the plugin zip.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Work out version
        id: ver
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            v="${GITHUB_REF_NAME#v}"
          else
            v="0.0.0"
          fi
          # Jellyfin wants a four-part version (1.2.3 -> 1.2.3.0).
          parts=$(echo "$v" | tr '.' '\n' | wc -l)
          while [ "$parts" -lt 4 ]; do v="$v.0"; parts=$((parts+1)); done
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: Test
        run: dotnet test -c Release

      - name: Build plugin
        run: >
          dotnet build src/Jellyfin.Plugin.WatchOrder -c Release
          -p:AssemblyVersion=${{ steps.ver.outputs.version }}
          -p:FileVersion=${{ steps.ver.outputs.version }}

      - name: Package
        run: |
          mkdir -p dist
          zip -j "dist/watch-order-playlists_${{ steps.ver.outputs.version }}.zip" \
            src/Jellyfin.Plugin.WatchOrder/bin/Release/net10.0/Jellyfin.Plugin.WatchOrder.dll

      - uses: actions/upload-artifact@v7
        with:
          name: watch-order-playlists_${{ steps.ver.outputs.version }}
          path: dist/*.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      # Jellyfin plugin repository manifest. It's attached to each release, so the URL
      #   https://github.com/<owner>/<repo>/releases/latest/download/manifest.json
      # always points at the newest version. Nothing is committed back to the repo.
      - name: Build manifest.json
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          zip="dist/watch-order-playlists_${VERSION}.zip"
          field() { grep "^$1:" build.yaml | head -1 | sed -E "s/^$1:[[:space:]]*\"?([^\"]*)\"?[[:space:]]*$/\1/"; }
          jq -n \
            --arg guid "$(field guid)" \
            --arg name "$(field name)" \
            --arg overview "$(field overview)" \
            --arg owner "$(field owner)" \
            --arg category "$(field category)" \
            --arg targetAbi "$(field targetAbi)" \
            --arg version "$VERSION" \
            --arg checksum "$(md5sum "$zip" | cut -d' ' -f1)" \
            --arg timestamp "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg sourceUrl "https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/$(basename "$zip")" \
            --arg changelog "https://github.com/${GITHUB_REPOSITORY}/releases/tag/${GITHUB_REF_NAME}" \
            '[{guid:$guid, name:$name, overview:$overview, description:$overview, owner:$owner, category:$category,
               versions:[{version:$version, changelog:$changelog, targetAbi:$targetAbi,
                          sourceUrl:$sourceUrl, checksum:$checksum, timestamp:$timestamp}]}]' \
            > dist/manifest.json
          cat dist/manifest.json

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME" dist/*.zip dist/manifest.json
          --repo "$GITHUB_REPOSITORY"
          --title "$GITHUB_REF_NAME"
          --generate-notes
