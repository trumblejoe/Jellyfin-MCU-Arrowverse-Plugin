name: Update lists

# Weekly maintenance of the built-in watch-order lists (src/Jellyfin.Plugin.WatchOrder/Lists).
#  - 'updates: auto' lists get newly aired episodes appended; 'updates: ongoing' lists get them
#    placed right after the show's last episode; due 'upcoming: movie:' lines become movies.
#    Tests run, then a commit to main. The lists are then published to the 'data' branch
#    (lists/*.txt + lists/index.json), where servers with a Backup data URL pick them up on
#    their next daily sync: no plugin release and no Jellyfin restart needed.
#  - Anything with no safe rule (e.g. a brand-new series) is reported in ONE GitHub issue
#    (label: list-updates), which emails the repo owner. Closed automatically once nothing's left.
# Only show names and episode codes are ever written to logs, commits and issues.
on:
  schedule:
    - cron: '23 7 * * 1'   # Mondays, 07:23 UTC
  workflow_dispatch:
  push:                    # publish hand edits to the lists too
    branches: [main]
    paths: ['src/Jellyfin.Plugin.WatchOrder/Lists/**']

permissions:
  contents: write   # commit list updates to main; publish them to the data branch
  issues: write     # open/update/close the list-updates issue

concurrency:
  group: data-branch   # shared with update-data.yml: one writer to the data branch at a time
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check and update lists
        id: lists
        run: python3 -I tools/lists/update_lists.py --report report.md

      - uses: actions/setup-dotnet@v6
        if: steps.lists.outputs.changed == 'true'
        with:
          dotnet-version: '10.0.x'

      - name: Test the updated lists
        if: steps.lists.outputs.changed == 'true'
        run: dotnet test -c Release

      - name: Commit the updated lists
        if: steps.lists.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add src/Jellyfin.Plugin.WatchOrder/Lists
          git commit -q -m "Update lists: newly aired episodes and released movies" -m "$(sed -n '/## Added automatically/,/## Needs Claude/p' report.md | grep '^- ')"
          git push -q origin HEAD:main

      - name: Publish the lists to the data branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git fetch -q --depth=1 origin data
          git worktree add -B data data-branch FETCH_HEAD
          mkdir -p data-branch/lists
          rm -f data-branch/lists/*.txt
          cp src/Jellyfin.Plugin.WatchOrder/Lists/*.txt data-branch/lists/
          python3 -I -c "import json,os; print(json.dumps(sorted(f[:-4] for f in os.listdir('data-branch/lists') if f.endswith('.txt'))))" > data-branch/lists/index.json
          cd data-branch
          git add -A lists
          if git diff --cached --quiet; then
            echo "Lists on the data branch are already current."
          else
            git commit -q -m "Publish lists"
            git push -q origin HEAD:data
            echo "Published lists to the data branch."
          fi

      - name: Open or update the list-updates issue
        if: steps.lists.outputs.attention == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create list-updates --color FBCA04 --description "Built-in watch-order lists need a person" --force >/dev/null
          issue=$(gh issue list --label list-updates --state open --json number --jq '.[0].number')
          if [ -z "$issue" ]; then
            gh issue create --title "Watch-order lists need updates" --label list-updates --body-file report.md
          else
            old=$(gh issue view "$issue" --json body --jq .body)
            if [ "$old" != "$(cat report.md)" ]; then
              gh issue edit "$issue" --body-file report.md
              gh issue comment "$issue" --body "The list report changed this week. See the updated description above."
            fi
          fi

      - name: Close the issue when nothing is left
        if: steps.lists.outputs.attention == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for issue in $(gh issue list --label list-updates --state open --json number --jq '.[].number'); do
            gh issue close "$issue" --comment "Nothing left to place this week; closing."
          done
