name: "Watch Order Playlists"
guid: "6f0c9a51-2b7e-4d8a-9c3f-1e5a7b2d4c60"
version: "1.2.0.0"
targetAbi: "12.4.0.0"
framework: "net10.0"
overview: "Spoiler-free playlists synced from arrowverse.info and aaronperris.com/mcu"
description: >
  Creates and keeps up to date playlists for the Arrowverse and the MCU (release,
  chronological and Sacred Timeline orders, each canon or Extended). Matches episodes by show, season and
  episode number only; never reads or logs episode titles or synopses.
category: "General"
owner: "trumblejoe"
artifacts:
- "Jellyfin.Plugin.WatchOrder.dll"
changelog: >
  1.2.0.0 - Canon and Extended (canon + non-canon) MCU playlists, renamed to sort in pairs
    (MCU Release / MCU Release Extended, ...). Existing playlists and settings convert automatically.
    Settings page now lists what's missing from your library (shows by name, movies by count).
    Built-in lists for franchises without an online guide: Batman TAS Fan Order, DCAU Release,
    DCU Release, Harry Potter Release, Saved by the Bell Chronological, Star Wars Chronological,
    Star Wars Release, Stargate Optimized, Doctor Who Release, One Chicago Release, Battlestar
    Galactica Release, Breaking Bad Release, and release/chronological Middle-earth, Wizarding World
    and Fast & Furious, The Wire Release. Movies can also match a show's specials.
    "Start at my next unwatched item": playlists drop watched items only from the front, so
    something watched out of order stays in its place. Lists update themselves weekly.
  1.1.0.0 - Per-user private playlists; remove watched items so each user's playlist starts
    at their next unwatched item; keep a last good copy of each guide in case a site goes offline.
  1.0.1.0 - Publish Jellyfin repository manifest.
  1.0.0.0 - Initial release.
